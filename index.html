<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ECONOMÍA MÓVIL</title>
<style>
*{ box-sizing:border-box; margin:0; padding:0; }

body{
  background:#f0f0f0;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  max-width:480px;
  margin:auto;
  padding:12px;
  text-transform:uppercase;
  letter-spacing:0.5px;
  font-weight:500;
  font-size:14px;
  color:#1a1a1a;
}

.topBar{
  position:sticky;
  top:0;
  z-index:100;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#fff;
  padding:14px 16px;
  margin-bottom:10px;
  border-radius:12px;
  box-shadow:0 1px 4px rgba(0,0,0,0.08);
}

#todayBox{
  font-size:17px;
  font-weight:800;
  color:#2f80ed;
  cursor:pointer;
  line-height:1.2;
}

#balance{
  font-size:22px;
  font-weight:900;
  cursor:pointer;
}

.positive{ color:#1a7a3a; }
.negative{ color:#c43030; }

.panel{
  background:#fff;
  border-radius:12px;
  padding:14px;
  margin-bottom:10px;
  box-shadow:0 1px 4px rgba(0,0,0,0.07);
}

h2{
  font-size:11px;
  font-weight:800;
  color:#aaa;
  letter-spacing:1.2px;
  margin-bottom:10px;
}

.item{
  border-radius:8px;
  padding:12px 14px;
  margin-top:8px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
  font-weight:600;
  transition:transform 0.1s, opacity 0.1s;
  user-select:none;
}

.item:active{ transform:scale(0.97); opacity:0.8; }

.item-pool     { background:#ebebeb; }
.item-recurrent{ background:#fff7e0; }
.item-assigned { background:#e0edff; }
.item-payment  { background:#ffe8b0; }
.item-paid     { background:#d0f5d8; color:#1a7a3a; }
.item-disabled { opacity:0.4; cursor:default; }
.item-disabled:active{ transform:none; opacity:0.4; }

.badge{
  font-size:12px;
  font-weight:800;
  color:#666;
  white-space:nowrap;
  margin-left:10px;
}

.item-input{ background:#f7f7f7; cursor:text; }
input{
  width:100%;
  border:none;
  outline:none;
  background:transparent;
  font-size:13px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:0.5px;
  color:#1a1a1a;
}
input::placeholder{ color:#bbb; }

#cajaBtnPanel{
  background:#fff;
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:10px;
  box-shadow:0 1px 4px rgba(0,0,0,0.07);
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
  transition:transform 0.1s;
  user-select:none;
}
#cajaBtnPanel:active{ transform:scale(0.98); }
#cajaBtnPanel .label{ font-size:13px; font-weight:700; }
#cajaBtnPanel .icon{ font-size:18px; font-weight:900; color:#bbb; }

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.35);
  justify-content:center;
  align-items:center;
  z-index:1000;
}
.modal.open{ display:flex; }

.modalContent{
  background:#fff;
  width:100%;
  max-width:480px;
  border-radius:16px 16px 0 0;
  padding:16px;
  max-height:85vh;
  overflow-y:auto;
  animation:slideUp 0.22s ease;
}

@keyframes slideUp{
  from{ transform:translateY(40px); opacity:0; }
  to{ transform:translateY(0); opacity:1; }
}

.modalTitle{
  font-size:11px;
  font-weight:800;
  color:#aaa;
  letter-spacing:1.2px;
  margin-bottom:12px;
}

.closeBtn{
  margin-top:14px;
  background:#f0f0f0;
  color:#555;
  padding:12px;
  border-radius:8px;
  text-align:center;
  cursor:pointer;
  font-size:12px;
  font-weight:800;
  letter-spacing:1px;
  transition:background 0.1s;
}
.closeBtn:active{ background:#e0e0e0; }

.caja-item{
  border-radius:8px;
  padding:12px 14px;
  margin-top:8px;
  background:#ebebeb;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
  transition:transform 0.1s, background 0.15s;
  user-select:none;
}
.caja-item:active{ transform:scale(0.97); }
.caja-item .plus{ color:#bbb; font-size:16px; font-weight:900; }
.caja-item.added{ background:#d0f5d8; }
.caja-item.added .plus{ color:#1a7a3a; }

.del-x{
  color:rgba(0,0,0,0.15);
  font-size:12px;
  font-weight:700;
  margin-left:10px;
  flex-shrink:0;
  cursor:pointer;
  padding:2px 5px;
  border-radius:4px;
  transition:color 0.15s, background 0.15s;
  line-height:1;
}
.del-x:hover{ color:#c43030; background:rgba(196,48,48,0.08); }

.caja-input{ background:#f7f7f7; cursor:text; }

.mov{
  border-radius:8px;
  padding:12px 14px;
  margin-top:8px;
  background:#f7f7f7;
  border-left:3px solid #ddd;
}
.mov.in-mov{ border-left-color:#1a7a3a; }
.mov.out-mov{ border-left-color:#c43030; }

.movTop{ display:flex; justify-content:space-between; align-items:center; }
.movName{ font-size:13px; font-weight:700; }
.movAmt{ font-size:13px; font-weight:900; }
.movAmt.in{ color:#1a7a3a; }
.movAmt.out{ color:#c43030; }
.movMeta{ display:flex; justify-content:space-between; margin-top:6px; font-size:11px; color:#999; }

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
  margin-top:8px;
}
.cal-head{ font-size:11px; font-weight:700; text-align:center; padding:6px 0; color:#bbb; }
.day{
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:8px;
  background:#f0f0f0;
  font-size:12px;
  font-weight:700;
  color:#666;
}
.today{ background:#1a1a1a; color:#fff; }

#adminReset{
  background:#fff;
  color:#ccc;
  text-align:center;
  padding:14px;
  border-radius:12px;
  font-size:11px;
  font-weight:800;
  letter-spacing:1px;
  cursor:pointer;
  margin-top:4px;
  margin-bottom:20px;
  box-shadow:0 1px 4px rgba(0,0,0,0.05);
}
#adminReset:active{ background:#f5f5f5; }
</style>
</head>
<body>

<div class="topBar">
  <div id="todayBox">--/--/-- · --:--</div>
  <div id="balance">0 €</div>
</div>

<div id="cajaBtnPanel" onclick="openCaja()">
  <div class="label">CAJA DE TAREAS</div>
  <div class="icon">＋</div>
</div>

<div class="panel">
  <h2>BOLSA DE TAREAS</h2>
  <div id="taskPool"></div>
</div>

<div class="panel">
  <h2>TAREAS REITERATIVAS</h2>
  <div id="recurrentTasks"></div>
</div>

<div class="panel">
  <h2>TAREAS ASIGNADAS</h2>
  <div id="assignedTasks"></div>
</div>

<div class="panel">
  <h2>PAGOS MENSUALES</h2>
  <div id="monthlyPayments"></div>
</div>

<div id="adminReset" onclick="resetAll()">RESET</div>

<div class="modal" id="cajaModal">
  <div class="modalContent">
    <div class="modalTitle">CAJA DE TAREAS</div>
    <div id="cajaList"></div>
    <div class="closeBtn" onclick="closeCaja()">CERRAR</div>
  </div>
</div>

<div class="modal" id="calendarModal">
  <div class="modalContent">
    <div class="modalTitle">CALENDARIO</div>
    <div class="calendar" id="calendar"></div>
    <div class="closeBtn" onclick="closeCalendar()">CERRAR</div>
  </div>
</div>

<div class="modal" id="walletModal">
  <div class="modalContent">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div class="modalTitle" style="margin-bottom:0;">MOVIMIENTOS</div>
      <div id="walletTotal" style="font-size:18px;font-weight:900;"></div>
    </div>
    <div id="movements"></div>
    <div class="closeBtn" onclick="closeWallet()">CERRAR</div>
  </div>
</div>

<script>
let balance = 0;
let tasks = ["LIMPIAR BAÑO","REPARAR MESA"];
let recurrentTasks = [
  { name:"TIRAR BASURA", done:false },
  { name:"HACER COMIDA", done:false }
];
let assigned = [];
let payments = [
  { name:"ALQUILER", cost:100, paid:false },
  { name:"BONO COMIDA", cost:20, paid:false }
];
let movements = [];
let lastDay = new Date().toDateString();
let cajaTareasPredefinidas = [
  "CAMBIAR CERRADURA","CAMBIAR BOMBILLA","PROCESAR ALIMENTOS"
];

function fmt(date = new Date()){
  const z = n => String(n).padStart(2,"0");
  return `${z(date.getDate())}/${z(date.getMonth()+1)}/${String(date.getFullYear()).slice(-2)} ${z(date.getHours())}:${z(date.getMinutes())}`;
}

function addMovement(type, amount, label){
  movements.unshift({ type, amount, label, wallet: balance, date: fmt() });
}

function save(){
  localStorage.setItem("ecoApp", JSON.stringify({
    balance, tasks, recurrentTasks, assigned, payments, movements, lastDay,
    cajaTareasPredefinidas
  }));
}

function load(){
  const data = localStorage.getItem("ecoApp");
  if(!data) return;
  const p = JSON.parse(data);
  balance = p.balance ?? 0;
  tasks = p.tasks ?? tasks;
  recurrentTasks = p.recurrentTasks ?? recurrentTasks;
  assigned = p.assigned ?? assigned;
  payments = p.payments ?? payments;
  movements = p.movements ?? movements;
  lastDay = p.lastDay ?? new Date().toDateString();
  cajaTareasPredefinidas = p.cajaTareasPredefinidas ?? cajaTareasPredefinidas;
}

function updateBalance(){
  const b = document.getElementById("balance");
  b.innerText = balance + " €";
  b.className = balance >= 0 ? "positive" : "negative";
}

function updateToday(){
  const d = new Date();
  const z = n => String(n).padStart(2,"0");
  document.getElementById("todayBox").innerText =
    `${z(d.getDate())}/${z(d.getMonth()+1)}/${String(d.getFullYear()).slice(-2)} · ${z(d.getHours())}:${z(d.getMinutes())}`;
  checkNewDay();
}

function checkNewDay(){
  const today = new Date().toDateString();
  if(today !== lastDay){
    recurrentTasks.forEach(t => t.done = false);
    lastDay = today;
    save(); render();
  }
}

function completeTask(i){
  const name = assigned[i];
  assigned.splice(i,1);
  balance += 1;
  addMovement("in",1,name);
  save(); updateBalance(); render();
}

function assignTask(i){
  assigned.push(tasks[i]);
  tasks.splice(i,1);
  save(); render();
}

function assignRecurrentTask(i){
  if(recurrentTasks[i].done) return;
  recurrentTasks[i].done = true;
  assigned.push(recurrentTasks[i].name);
  save(); render();
}

function payMonthly(i){
  if(payments[i].paid) return;
  payments[i].paid = true;
  balance -= payments[i].cost;
  addMovement("out", payments[i].cost, payments[i].name);
  save(); updateBalance(); render();
}

function openCaja(){ document.getElementById("cajaModal").classList.add("open"); renderCaja(); }
function closeCaja(){ document.getElementById("cajaModal").classList.remove("open"); }

function renderCaja(){
  const list = document.getElementById("cajaList");
  list.innerHTML = "";

  cajaTareasPredefinidas.forEach((nombre, idx) => {
    const d = document.createElement("div");
    d.className = "caja-item";

    const nameSpan = document.createElement("span");
    nameSpan.innerText = nombre;
    nameSpan.style.flex = "1";

    const delBtn = document.createElement("span");
    delBtn.className = "del-x";
    delBtn.innerText = "✕";
    delBtn.onclick = (e) => {
      e.stopPropagation();
      cajaTareasPredefinidas.splice(idx, 1);
      save();
      renderCaja();
    };

    const plusSpan = document.createElement("span");
    plusSpan.className = "plus";
    plusSpan.innerText = "＋";

    d.appendChild(nameSpan);
    d.appendChild(delBtn);
    d.appendChild(plusSpan);

    d.onclick = () => {
      tasks.push(nombre);
      save(); render();
      d.classList.add("added");
      plusSpan.innerText = "✓";
      setTimeout(() => {
        d.classList.remove("added");
        plusSpan.innerText = "＋";
      }, 700);
    };

    list.appendChild(d);
  });

  const cajaInp = document.createElement("input");
  cajaInp.placeholder = "+ NUEVA TAREA DE CAJA";
  const cajaBox = document.createElement("div");
  cajaBox.className = "caja-item caja-input";
  cajaBox.appendChild(cajaInp);
  cajaInp.onkeydown = e => {
    if(e.key === "Enter" && cajaInp.value.trim()){
      cajaTareasPredefinidas.push(cajaInp.value.toUpperCase());
      save();
      renderCaja();
    }
  };
  list.appendChild(cajaBox);
}

function openCalendar(){
  document.getElementById("calendarModal").classList.add("open");
  renderCalendar();
}
function closeCalendar(){ document.getElementById("calendarModal").classList.remove("open"); }

function renderCalendar(){
  const c = document.getElementById("calendar");
  c.innerHTML = "";
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), today = now.getDate();
  const first = new Date(y,m,1).getDay();
  const days = new Date(y,m+1,0).getDate();
  const offset = first===0 ? 6 : first-1;
  ["L","M","X","J","V","S","D"].forEach(d=>{
    const el = document.createElement("div");
    el.className = "cal-head"; el.innerText = d; c.appendChild(el);
  });
  for(let i=0;i<offset;i++) c.appendChild(document.createElement("div"));
  for(let i=1;i<=days;i++){
    const d = document.createElement("div");
    d.className = "day" + (i===today ? " today" : "");
    d.innerText = i; c.appendChild(d);
  }
}

function openWallet(){
  document.getElementById("walletModal").classList.add("open");
  renderMovements();
}
function closeWallet(){ document.getElementById("walletModal").classList.remove("open"); }

function renderMovements(){
  const m = document.getElementById("movements");
  const total = document.getElementById("walletTotal");
  total.innerText = balance + " €";
  total.className = balance >= 0 ? "positive" : "negative";
  m.innerHTML = "";
  movements.forEach(x => {
    const div = document.createElement("div");
    div.className = `mov ${x.type==="in" ? "in-mov" : "out-mov"}`;
    div.innerHTML = `
      <div class="movTop">
        <div class="movName">${x.label}</div>
        <div class="movAmt ${x.type}">${x.type==="in" ? "+" : "-"}${x.amount}€</div>
      </div>
      <div class="movMeta">
        <span class="${x.wallet>=0?"positive":"negative"}">CARTERA: ${x.wallet}€</span>
        <span>${x.date}</span>
      </div>`;
    m.appendChild(div);
  });
}

/* 🔥 RESET COMPLETO (ACTUALIZADO) */
function resetAll(){
  if(!confirm("RESET COMPLETO?")) return;

  localStorage.removeItem("ecoApp");

  balance = 0;
  tasks = [];
  recurrentTasks = [];
  assigned = [];
  payments = [
    { name:"ALQUILER", cost:100, paid:false },
    { name:"BONO COMIDA", cost:20, paid:false }
  ];
  movements = [];
  cajaTareasPredefinidas = [
    "CAMBIAR CERRADURA","CAMBIAR BOMBILLA","PROCESAR ALIMENTOS"
  ];
  lastDay = new Date().toDateString();

  updateBalance();
  render();
}

/* RENDER */
function makeX(fn){
  const x = document.createElement("span");
  x.className = "del-x";
  x.innerText = "✕";
  x.onclick = e => { e.stopPropagation(); fn(); };
  return x;
}

function render(){
  const pool = document.getElementById("taskPool");
  const recDiv = document.getElementById("recurrentTasks");
  const assDiv = document.getElementById("assignedTasks");
  const payDiv = document.getElementById("monthlyPayments");
  pool.innerHTML = ""; recDiv.innerHTML = ""; assDiv.innerHTML = ""; payDiv.innerHTML = "";

  tasks.forEach((t,i)=>{
    const d = document.createElement("div");
    d.className = "item item-pool";
    const s = document.createElement("span"); s.innerText = t; s.style.flex="1";
    d.appendChild(s);
    d.appendChild(makeX(()=>{ tasks.splice(i,1); save(); render(); }));
    d.onclick = ()=>assignTask(i);
    pool.appendChild(d);
  });

  const inp = document.createElement("input");
  inp.placeholder = "+ NUEVA TAREA";
  const inpBox = document.createElement("div");
  inpBox.className = "item item-input";
  inpBox.appendChild(inp);
  inp.onkeydown = e => {
    if(e.key==="Enter" && inp.value.trim()){
      tasks.push(inp.value.toUpperCase());
      save(); render();
    }
  };
  pool.appendChild(inpBox);

  recurrentTasks.forEach((t,i)=>{
    const d = document.createElement("div");
    d.className = "item item-recurrent" + (t.done ? " item-disabled" : "");
    const s = document.createElement("span"); s.innerText = t.name; s.style.flex="1";
    d.appendChild(s);
    d.appendChild(makeX(()=>{ recurrentTasks.splice(i,1); save(); render(); }));
    d.onclick = ()=>assignRecurrentTask(i);
    recDiv.appendChild(d);
  });

  const recInp = document.createElement("input");
  recInp.placeholder = "+ NUEVA REITERATIVA";
  const recBox = document.createElement("div");
  recBox.className = "item item-recurrent item-input";
  recBox.appendChild(recInp);
  recInp.onkeydown = e => {
    if(e.key==="Enter" && recInp.value.trim()){
      recurrentTasks.push({ name: recInp.value.toUpperCase(), done:false });
      save(); render();
    }
  };
  recDiv.appendChild(recBox);

  assigned.forEach((t,i)=>{
    const d = document.createElement("div");
    d.className = "item item-assigned";
    const s = document.createElement("span"); s.innerText = t; s.style.flex="1";
    d.appendChild(s);
    d.appendChild(makeX(()=>{ assigned.splice(i,1); save(); render(); }));
    d.onclick = ()=>completeTask(i);
    assDiv.appendChild(d);
  });

  payments.forEach((p,i)=>{
    const d = document.createElement("div");
    d.className = "item " + (p.paid ? "item-paid" : "item-payment");
    const s = document.createElement("span"); s.innerText = p.name; s.style.flex="1";
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.innerText = p.paid ? "✓ PAGADO" : "-"+p.cost+"€";
    d.appendChild(s);
    d.appendChild(badge);
    d.appendChild(makeX(()=>{ payments.splice(i,1); save(); render(); }));
    d.onclick = ()=>payMonthly(i);
    payDiv.appendChild(d);
  });
}

/* INIT */
load();
updateBalance();
updateToday();
render();

document.getElementById("balance").onclick = openWallet;
document.getElementById("todayBox").onclick = openCalendar;
setInterval(updateToday, 1000);
</script>
</body>
</html>
